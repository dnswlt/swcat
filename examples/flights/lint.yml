# Compare each Component's observed dependencies (reported via the
# /catalog/observed-dependencies API and stored as "swcat-deps/*" status
# observations) against its actual neighbors, and warn about observed
# dependencies that are neither declared nor reachable through a shared API.
# See scripts/add-observed-deps.sh for a way to populate observations.
checkDependencyCandidates: true

celRules:
  - name: has-description
    severity: warn
    check: |
      !matches(metadata.description, "^\\s*$")
    message: "The entity should have a non-empty description for better documentation."

  - name: api-has-provider
    severity: error
    condition: "kind == 'API'"
    check: 'size(spec.providers) > 0'
    message: "The API must have at least one provider component."

reportedGroups:
  - analytics-owner
  - flights-owner
  - iam-owner
  - payments-owner
