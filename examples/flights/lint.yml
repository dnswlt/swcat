# Compare the dependencies implied by each Component's observed endpoints
# (reported via the /catalog/observed-endpoints API and stored as
# "swcat-endpoints/*" status observations) against its actual neighbors, and
# warn about observed dependencies that are neither declared nor reachable
# through a shared API.
# See scripts/add-observed-endpoints.sh for a way to populate observations.
checkDependencyCandidates: true

celRules:
  - name: has-description
    severity: warn
    check: |
      !matches(metadata.description, "^\\s*$")
    message: "The entity should have a non-empty description for better documentation."

  - name: api-has-provider
    severity: error
    condition: "kind == 'API'"
    check: 'size(spec.providers) > 0'
    message: "The API must have at least one provider component."

reportedGroups:
  - analytics-owner
  - flights-owner
  - iam-owner
  - payments-owner
