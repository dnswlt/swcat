apiVersion: swcat/v1
kind: Domain
metadata:
  name: analytics
  description: Services for business analytics.
spec:
  owner: analytics-owner
---
apiVersion: swcat/v1
kind: Group
metadata:
  name: analytics-owner
  description: The owners of the analytics domain.
spec:
  type: team
  profile:
    displayName: Analytics Owner Group
    email: analytics@example.com
---
apiVersion: swcat/v1
kind: System
metadata:
  name: analytics-pipeline
  title: Analytics Pipeline
  # description: The data pipeline for collecting and processing analytics events.
spec:
  owner: analytics-owner
  domain: analytics
---
apiVersion: swcat/v1
kind: API
metadata:
  name: analytics-events-api
  description: |
    API for ingesting analytics events.

    Ingested events end up in the resource:raw-events-storage.
  annotations:
    swcat/visibility: public
    maven.apache.org/coords: org.slf4j:slf4j-api
    # An AsyncAPI 2.x extract: 2.x has no operations, so channels are
    # reported instead, and there is no way to express request/reply.
    asyncapi.com/channels: |-
      [
        {
          "version": "3.1.4",
          "asyncapiVersion": "2.6.0",
          "channels": [
            { "name": "analytics.events.raw.v1", "address": "analytics.events.raw.v1", "messages": ["PageViewed", "SessionStarted"] },
            { "name": "analytics.events.booking.v1", "address": "analytics.events.booking.v1", "messages": ["BookingStarted", "BookingCompleted"] },
            { "name": "analytics.events.search.v1", "address": "analytics.events.search.v1", "messages": ["FlightSearched"] },
            { "name": "analytics.events.payment.v1", "address": "analytics.events.payment.v1", "messages": ["PaymentAuthorized", "PaymentDeclined"] },
            { "name": "analytics.events.error.v1", "address": "analytics.events.error.v1", "messages": ["ClientError"] },
            { "name": "analytics.ingest.dlq.v1", "address": "analytics.ingest.dlq.v1", "messages": ["RejectedEvent"] }
          ]
        }
      ]
spec:
  type: kafka/csv
  lifecycle: production
  owner: analytics-owner
  system: analytics-pipeline
---
apiVersion: swcat/v1
kind: Resource
metadata:
  name: raw-events-storage
  description: Intermediate storage for raw analytics events.
spec:
  type: kafka
  owner: analytics-owner
  system: analytics-pipeline
---
apiVersion: swcat/v1
kind: Resource
metadata:
  name: processed-events-storage
  description: Queryable storage for processed analytics events.
spec:
  type: analytics-database
  owner: analytics-owner
  system: analytics-pipeline
---
apiVersion: swcat/v1
kind: Component
metadata:
  name: events-collector
  description: Collects analytics events and puts them into the raw events storage.
spec:
  type: service
  lifecycle: production
  owner: analytics-owner
  system: analytics-pipeline
  providesApis:
    - analytics-events-api
  dependsOn:
    - resource:raw-events-storage
---
apiVersion: swcat/v1
kind: Component
metadata:
  name: events-processor
  description: Processes raw events and stores them in the processed events storage.
spec:
  type: job
  lifecycle: production
  owner: analytics-owner
  system: analytics-pipeline
  dependsOn:
    - resource:raw-events-storage
    - resource:processed-events-storage
