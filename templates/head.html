<meta charset="utf-8" />
<title>{{ if .PageTitle }}{{ .PageTitle }} &ndash; {{ end }}swcat</title>


<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="72x72" href="/static/icons/favicon-72x72.png">
<link rel="icon" type="image/png" sizes="96x96" href="/static/icons/favicon-96x96.png">
<!-- Tailwind -->
<link rel="stylesheet" href='{{ asset "main.css" }}' />

<!-- Swaps that push the URL stay, but Back/Forward loads the page normally
     instead of restoring it from htmx's snapshot cache: restored snapshots are
     copies of the saved HTML, without any of the listeners the page wired up. -->
<meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
<script src="/static/js/htmx-2.0.6.min.js"></script>
<script src="/static/js/path-params-2.0.1.min.js"></script>
